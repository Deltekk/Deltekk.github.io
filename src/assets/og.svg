<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Immagine di anteprima dei link (Open Graph / Twitter card) di susino.dev.
    Sorgente di public/og.png (1200x630): dopo una modifica va riesportata in PNG
    con le stesse dimensioni, ad esempio da Inkscape (File > Esporta).
    Colori: viola del marchio #5B24F1 (viola-700), viola-950 #26126B, fucsia-600 #C800DE.
  -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26126B" />
      <stop offset=".55" stop-color="#5B24F1" />
      <stop offset="1" stop-color="#C800DE" />
    </linearGradient>
    <radialGradient id="luce" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sfondo)" />
  <circle cx="1040" cy="90" r="320" fill="url(#luce)" />
  <circle cx="140" cy="600" r="260" fill="url(#luce)" />

  <!-- Prugna (come src/assets/logo.svg), in un riquadro chiaro -->
  <rect x="96" y="171" width="288" height="288" rx="64" fill="#FFFFFF" fill-opacity=".95" />
  <g transform="translate(128 203) scale(3.5)">
    <path d="M32 17C40 11 57 14 57.5 33.5C58 50 46 61 32 61C18 61 6 50 6.5 33.5C7 14 24 11 32 17Z" fill="#5B24F1" />
    <path d="M32 18.5C27 28 26.5 46 30.5 59" stroke="#000" stroke-opacity=".22" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <ellipse cx="19" cy="31" rx="3.6" ry="7.5" transform="rotate(22 19 31)" fill="#FFFFFF" fill-opacity=".35" />
    <path d="M32 18C32 12 33.5 8 37 4.5" stroke="#52525B" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M35.5 11C38.5 3.5 48 1 56 4C52 12 43.5 15 35.5 11Z" fill="#10B981" />
    <path d="M37.5 10.2C42 7.5 47 5.8 52 5.2" stroke="#047857" stroke-width="1.4" stroke-linecap="round" fill="none" />
  </g>

  <g font-family="Inter, 'DejaVu Sans', sans-serif" fill="#FFFFFF">
    <text x="440" y="300" font-size="104" font-weight="800" letter-spacing="-3">susino.dev</text>
    <text x="444" y="370" font-size="33" font-weight="500" fill-opacity=".85">Progettini, esperimenti e pagine personali</text>
  </g>
</svg>
